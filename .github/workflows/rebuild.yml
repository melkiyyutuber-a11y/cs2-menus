name: Rebuild for KHook Metamod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y clang lld binutils python3-pip zip
          git clone https://github.com/alliedmodders/ambuild.git
          pip install ./ambuild
          mkdir -p external
          cd external
          git clone --recursive --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
          git clone --recursive --branch cs2 --single-branch https://github.com/alliedmodders/s2sdk.git hl2sdk-cs2
          # SDK на момент до переименования полей схемы (21.10), под который написан SchemaEntity Pisex
          (cd hl2sdk-cs2 && git checkout 6d7934b58 && git submodule update --init --recursive)
          cd ../..
          git clone https://github.com/pisex/SchemaEntity.git || true
      - name: Build
        run: |
          git clone https://github.com/alliedmodders/hl2sdk-manifests.git external/hl2sdk-manifests
          # новый SDK разнёс .proto по папкам — собираем их по старому пути, который ждут скрипты Pisex
          P=external/hl2sdk-cs2/thirdparty/game_protobufs/csgo
          mkdir -p $P
          find external/hl2sdk-cs2 -name '*.proto' -not -path "*/game_protobufs/csgo/*" | while read f; do
            b=$(basename "$f"); [ -e "$P/$b" ] || ln -s "$(realpath "$f")" "$P/$b"; done
          ls $P | head -50
          # .cpp из SDK, на которые ссылается AMBuildScript, но которых нет: ищем по имени, иначе пустая заглушка
          python3 fix_sdk.py
          mkdir build && cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize --hl2sdk-manifests=$GITHUB_WORKSPACE/external/hl2sdk-manifests --mms_path=$MMS_PATH --hl2sdk-root=$HL2SDK_ROOT
          # до 20 проходов: при «заголовок не найден» ставим ссылку на новый путь и собираем снова
          for i in $(seq 1 20); do
            if ambuild > ../build.log 2>&1; then echo "BUILD OK"; exit 0; fi
            (cd .. && python3 fix_inc.py build.log) || { grep -E "error" ../build.log | head -60; exit 1; }
          done
          exit 1
      - name: Pack
        run: cd build/package && zip -r ../../out.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out.zip
